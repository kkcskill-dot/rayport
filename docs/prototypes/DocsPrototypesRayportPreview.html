    operations:['운영 DB의 여유를 먼저 지킵니다.','조회·수집·마트 갱신이 하나의 부하 예산을 공유합니다.'],
    compare:['기존 데이터 자산 위에, 업무 서비스 계층','DW·DM을 활용하며 실제 질문과 쿼리를 API의 수요로 연결합니다.']
  };
  let page = 'ask', missing = false, draft = false, normal = true;
  let question = '이번 주 거래처별 미수금 현황을 보여줘';
  const missingQuestion = '반품 사유별 미수금 변화를 매주 확인하고 싶어';
  const requests = [];
  const $ = id => document.getElementById(id);
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pill = (text,tone='') => `<span class="pill ${tone}">${text}</span>`;
  const button = (text,action,tone='secondary') => `<button class="button ${tone}" data-action="${action}">${text}</button>`;
  function comparison(){return `<section class="comparison section-gap" aria-label="DW DM과 레이포트의 설계 흐름 비교"><div class="section-heading"><h2>데이터를 쌓는 흐름과 업무에 제공하는 흐름</h2><span class="muted">역할 비교 · 성능 순위 아님</span></div><div class="flow-row"><strong>DW · DM</strong><div class="flow"><span>원천 데이터</span><b>→</b><span>수집 · 정제</span><b>→</b><span>DW · 업무 마트</span><b>→</b><span>리포트 · 분석</span></div></div><div class="flow-row"><strong>레이포트</strong><div class="flow ray"><span>업무 질문 · SQL</span><b>→</b><span>검증된 업무 API</span><b>→</b><span>DW · DM · 복제본<br>캐시 · 수요 마트</span><b>→</b><span>답변 · 앱 · 자동화</span></div></div><p class="muted">레이포트의 제안: 사용 수요 → API 후보 → 검증 → 제공 → 반복 사용을 위한 사전 구성. 기존 DW와 DM은 그대로 제공 경로에 참여합니다.</p></section>`;}
  function context(){return `<aside class="context-panel"><div class="context-card"><p class="eyebrow">데이터 신뢰 정보</p><h3>답변의 기준을 함께 확인하세요.</h3><dl><div><dt>업무 담당</dt><dd>재무운영팀</dd></div><div><dt>접근 범위</dt><dd>내 담당 거래처</dd></div><div><dt>허용 지연</dt><dd>최대 1시간</dd></div><div><dt>데이터 상태</dt><dd class="teal">시안 기준 정상</dd></div></dl></div><div class="context-card soft"><span class="feature-symbol">▥</span><h3>자주 쓰는 조회는<br>미리 준비해 둡니다.</h3><p>반복 요청은 수요 마트로 제공해 운영 DB의 추가 조회를 줄입니다.</p><button class="text-button" data-page="marts">수요 마트 살펴보기 →</button></div></aside>`;}
  function result(){return `<div class="section-heading"><h2>거래처별 미수금 현황</h2>${pill('승인된 API')}</div><p class="result-summary">확인할 미수금은 <strong>12.8억 원</strong>입니다.<br>가상 거래처 3곳이 전체 미수금의 <strong>68%</strong>를 차지합니다.</p><div class="result-meta"><span>기준 시점 <strong>11.08 09:00</strong></span><span>조회 경로 <strong>미수금 수요 마트</strong></span><span>원본 추가 조회 <strong>없음</strong></span></div><div class="table-scroll"><table><thead><tr><th>거래처</th><th>미수금</th><th>전주 대비</th><th>검토 상태</th></tr></thead><tbody><tr><td><span class="company-icon">가</span> 가상유통</td><td>4.2억</td><td class="amount-up">+8.4%</td><td>${pill('확인 필요','amber')}</td></tr><tr><td><span class="company-icon">나</span> 나래상사</td><td>2.8억</td><td class="amount-down">−3.2%</td><td>${pill('정상','neutral')}</td></tr><tr><td><span class="company-icon">다</span> 다온산업</td><td>1.7억</td><td class="amount-up">+2.1%</td><td>${pill('정상','neutral')}</td></tr></tbody></table></div><div class="source-line"><span>◈</span><div><strong>거래처 미수금 조회 <code>v1</code></strong><small>업무 정의: 매출채권 잔액 · 취소 전표 제외 · 원화 기준</small></div><button class="text-button" data-page="catalog">근거 보기 ↗</button></div><div class="follow-up"><span>이어서 확인하기</span><button data-action="missing">반품 사유와 함께 보고 싶어요 ↗</button></div>`;}
  function missingResult(){return `<div class="section-heading"><h2>새로운 업무 기능이 필요합니다</h2>${pill('기능 없음','amber')}</div><p class="question-quote">“${escape(question)}”</p><p>이 질문에 맞는 승인된 API가 아직 없습니다. 필요한 항목을 정리해 담당자에게 생성 요청을 보낼 수 있습니다.</p><div class="request-draft"><p class="eyebrow">생성 요청 초안</p><h3>${escape(question)}</h3><dl><div><dt>업무 목적</dt><dd>${/반품/.test(question)?'반품과 미수금 변동을 함께 확인':'질문 원문을 토대로 업무 담당자가 확정'}</dd></div><div><dt>필요 데이터</dt><dd>${/반품/.test(question)?'거래처 · 반품 사유 · 미수금 · 기준일':'업무 정의 검토에서 확인'}</dd></div><div><dt>허용 지연</dt><dd>초안: 매일 갱신 · 담당자 확인 필요</dd></div><div><dt>제공 방식</dt><dd>조회 API + 반복 조회용 마트 검토</dd></div></dl><p class="muted">임의 질문의 상세 의미 분석은 데모에 포함되지 않습니다. 질문 원문을 보존하고 담당자가 상세 정의를 확정합니다.</p></div><div class="action-row">${button('이 내용으로 생성 요청','request','primary')}<span class="muted">요청 즉시 API가 배포되지는 않습니다.</span></div>`;}
  function metric(label,value,note){return `<div class="metric"><span>${label}</span><strong>${value}</strong><p>${note}</p></div>`;}
  function render(){
    $('navigation').innerHTML = nav.map((n,i)=>`${i===0||nav[i-1][3]!==n[3]?`<p class="nav-group">${n[3]}</p>`:''}<button class="nav-item ${page===n[0]?'active':''}" data-page="${n[0]}" ${page===n[0]?'aria-current="page"':''}><span>${n[1]}</span>${n[2]}${n[0]==='requests'&&requests.length?`<span class="nav-count">${requests.length}</span>`:''}</button>`).join('');
    $('breadcrumb').textContent = nav.find(n=>n[0]===page)[2];
    $('page-heading').innerHTML = `<div class="page-heading"><div><h1>${titles[page][0]}</h1><p class="subtitle">${titles[page][1]}</p></div></div>`;
    let content='';
    if(page==='ask') content=`<form class="ask-box" id="ask-form"><label for="question">어떤 업무 데이터가 필요한가요?</label><div class="question-input"><input id="question" value="${escape(question)}"><button class="button primary" type="submit">질문하기 ↗</button></div><div class="ask-hints"><span>예시로 살펴보기</span><button type="button" data-action="known">미수금 현황</button><button type="button" data-action="missing">없는 기능 요청</button><span class="hint-right">승인된 API만 조회</span></div></form><div class="content-grid"><section class="answer-card">${missing?missingResult():result()}</section>${context()}</div>${comparison()}`;
    if(page==='catalog') content=`<section class="panel"><div class="section-heading"><h2>거래처 미수금 조회</h2>${pill('게시됨 · v1')}</div><p>거래처별 매출채권 잔액을 기준일에 따라 조회합니다. 취소 전표를 제외하고 원화 기준으로 합산합니다.</p><div class="code-line">GET /api/business/v1/receivables?as_of=2026-11-08</div><div class="details-grid"><div><h3>입력</h3><p>기준일 · 거래처 코드<br>조회 기간 최대 31일</p></div><div><h3>정책</h3><p>재무 담당자 역할<br>서버에서 담당 거래처 범위 강제</p></div><div><h3>제공 경로</h3><p>미수금 수요 마트<br>허용 지연 1시간</p></div></div><div class="callout">이 계약은 설계 예시입니다. 인증·권한·SQL 실행은 아직 구현되지 않았습니다.</div></section>`;
    if(page==='requests') content=`<section class="panel"><div class="section-heading"><h2>내 생성 요청</h2>${pill(requests.length+'건 · 현재 시안 세션','neutral')}</div>${requests.length?requests.map((q,i)=>`<div class="request-row"><span class="request-id">REQ-${String(i+1).padStart(3,'0')}</span><div><h3>${escape(q)}</h3><p>업무 정의 확인 → DBA 검증 → 승인 → 게시</p></div>${pill('업무 정의 대기','amber')}</div>`).join(''):`<div class="empty-state"><span>↗</span><h3>아직 생성 요청이 없습니다.</h3><p>업무 질문에서 없는 기능의 생성 요청을 등록해 보세요.</p>${button('생성 요청 흐름 살펴보기','missing','primary')}</div>`}</section>`;
    if(page==='candidates') content=`<div class="summary-grid">${metric('검토할 API 후보','3 <small>건</small>','관측 SQL에서 발견한 데모 후보')}${metric('자료의 범위','7 <small>일</small>','AWR 구간 통계 + ASH 활동 표본')}${metric('게시 전 필수','업무 · DBA','의미와 실행 영향을 각각 검토')}</div><section class="panel"><div class="section-heading"><div><p class="eyebrow">후보 01 / 재무 업무</p><h2>거래처별 미수금 조회</h2></div>${pill(draft?'검토 초안 생성됨':'업무 확인 필요','amber')}</div><p>여러 화면에서 유사한 집계 SQL이 반복 관측되었습니다. 기준일과 거래처를 입력받는 하나의 업무 API로 묶는 방안을 제안합니다.</p><div class="details-grid"><div><h3>관측 근거</h3><p>SQL 패턴 4개 · 모듈 AR_SUMMARY<br>AWR 포착 범위 내 실행 델타</p></div><div><h3>제공 경로 제안</h3><p>기존 재무 DM 우선 연결<br>적합하지 않으면 수요 마트 검토</p></div><div><h3>추가 확인</h3><p>취소 전표 처리 · 회계 기준일<br>회사별 통화 · 접근 권한</p></div></div><div class="callout">ASH 표본 수는 SQL 실행 횟수가 아닙니다. 자동 제안은 수집 범위·근거·확신 수준을 함께 표시합니다.</div><div class="action-row">${button('API 계약 초안 만들기','draft','primary')}<span class="muted">분석 → 초안 → 검증 → 승인 → 게시</span></div></section>`;
    if(page==='marts') content=`<div class="summary-grid">${metric('업무 마트','2 <small>개</small>','가상 운영 상태')}${metric('설계 원칙','필요한 범위만','질문·사용량·비용으로 구성 판단')}${metric('갱신 정책','예산 안에서','운영 부하가 높으면 지연·중지')}</div><section class="panel"><div class="section-heading"><h2>미수금 요약 마트</h2>${pill('제공 중 · 가상')}</div><p>거래처 × 기준일 단위로 자주 조회하는 잔액만 준비합니다. 기존 재무 DM의 정의와 갱신 상태를 먼저 확인합니다.</p><div class="details-grid"><div><h3>원천</h3><p>재무 DM → 요약 마트<br>운영 원본 직접 조회: 기본 차단</p></div><div><h3>갱신</h3><p>증분 갱신 · 매시간 제안<br>삭제·정정 전표 재계산 포함</p></div><div><h3>승격 판단</h3><p>절감될 반복 조회 비용<br>− 갱신·보관·운영 비용</p></div></div><div class="callout">마트는 원본 부하를 없애지 않습니다. 초기 적재·증분 추출·정합성 확인도 부하 예산에 포함합니다.</div></section><section class="panel section-gap"><div class="section-heading"><h2>반품 사유 분석 마트</h2>${pill('생성 제안','amber')}</div><p>관련 질문과 생성 요청이 모이면 업무 정의와 데이터 소유자를 확인한 뒤 구성합니다.</p><button class="button secondary" data-page="requests">관련 생성 요청 보기 →</button></section>`;
    if(page==='operations') content=`<div class="policy-banner"><div>${pill('원본 DB 보호 정책')}<h2>허용된 경로에서만 조회합니다.</h2><p>캐시·마트·DW/DM·복제본을 우선 사용합니다. 장애 시 운영 원본으로 자동 전환하지 않습니다.</p></div>${button(normal?'혼잡 상황 시뮬레이션':'정상 상황으로','simulate')}</div><div class="summary-grid section-gap">${metric('원본 직접 조회','기본 차단','개별 API의 명시적 허용이 필요')}${metric('동시 실행 예산',normal?'2 / 4':'4 / 4','시안 값 · 실제 권장치가 아님')}${metric('현재 처리',normal?'정상 제공':'갱신 대기',normal?'허용 지연 안에서 데이터 제공':'기존 결과 제공 · 원본 우회 없음')}</div><section class="panel"><div class="section-heading"><h2>실행 전 확인하는 정책</h2>${pill('APIC 실행 연계 · 시안','neutral')}</div><p class="muted">원천 실행은 APIC를 통해 요청합니다. ASH/AWR 기본 반입 경로는 BeLoga 파일입니다.</p><div class="policy-list">${['사용자 권한과 행·열 범위','API 계약과 파라미터 허용 범위','데이터 최신성 및 의미 일치','소스별 동시 실행·시간·행 수 예산','실행 실패 시 중단과 감사 기록'].map((t,i)=>`<div><span class="step-number">0${i+1}</span><strong>${t}</strong><span class="teal">필수</span></div>`).join('')}</div></section>`;
    if(page==='compare') content=`${comparison()}<section class="panel section-gap"><h2>차별점은 하나의 연결된 업무 흐름입니다.</h2><p>실제 업무 SQL과 질문으로 수요를 발견하고, 검증된 API로 제공하며, 반복 비용이 커지는 부분만 사전 구성합니다. 데이터 가상화·캐시·AI 질의 자체는 다른 솔루션에도 존재합니다.</p><div class="details-grid"><div><h3>업무 수요</h3><p>질문·실행 패턴에서<br>필요한 기능을 발견</p></div><div><h3>업무 계약</h3><p>의미·권한·최신성·예산을<br>하나의 API 버전으로 관리</p></div><div><h3>운영 피드백</h3><p>수요와 갱신 비용을 보고<br>제공 경로를 다시 선택</p></div></div></section>`;
    $('page-content').innerHTML = content;
  }
  function toast(text){$('toast').className='toast';$('toast').textContent='✓ '+text;}
  document.addEventListener('click',event=>{
    const target=event.target.closest('button'); if(!target)return;
    if(target.dataset.page){page=target.dataset.page;$('toast').className='';$('toast').textContent='';render();return;}
    const action=target.dataset.action;
    if(action==='known'){page='ask';question='이번 주 거래처별 미수금 현황을 보여줘';missing=false;render();}
    if(action==='missing'){page='ask';question=missingQuestion;missing=true;render();}
    if(action==='request'){if(requests.includes(question))toast('이 질문의 생성 요청이 이미 있습니다. 생성 요청 메뉴에서 확인하세요.');else{requests.push(question);render();toast('REQ-'+String(requests.length).padStart(3,'0')+' 생성 요청을 데모 목록에 등록했습니다. 새로고침하면 초기화됩니다.');}}
    if(action==='draft'){draft=true;render();toast('API 계약 검토 초안을 데모 상태에 생성했습니다. 실제 배포는 수행되지 않습니다.');}
    if(action==='simulate'){normal=!normal;render();}
  });
  document.addEventListener('submit',event=>{if(event.target.id!=='ask-form')return;event.preventDefault();const value=$('question').value.trim();if(!value)return;question=value;missing=!(/미수금/.test(value)&&!/반품|사유/.test(value));render();});
  render();
})();
</script>
